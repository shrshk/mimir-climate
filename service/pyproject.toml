[project]
name = "mimir-climate"
version = "0.1.0"
description = "The home's thermostats for an assistant: read them, and change their schedules when asked."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright==1.64.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mimir-climate = "mimir_climate.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
